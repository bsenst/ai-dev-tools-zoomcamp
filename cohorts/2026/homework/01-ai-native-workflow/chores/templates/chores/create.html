<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Chore</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f4f6f8; }
      .container { max-width: 600px; margin: 0 auto; }
      .card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
      form { display: grid; gap: 1rem; }
      label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
      input, textarea { width: 100%; padding: 0.6rem; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
      textarea { min-height: 90px; }
      button { background: #1f6feb; color: white; border: none; border-radius: 8px; padding: 0.7rem 1rem; cursor: pointer; }
      .actions { display: flex; gap: 0.75rem; align-items: center; }
      a { color: #1f6feb; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Add a chore</h1>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <div class="actions">
            <button type="submit">Save chore</button>
            <a href="{% url 'chores:index' %}">Back to dashboard</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
